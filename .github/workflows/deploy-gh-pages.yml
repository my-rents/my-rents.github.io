name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
  workflow_call:
    secrets:
      VITE_FIREBASE_API_KEY:
        required: false
      VITE_FIREBASE_AUTH_DOMAIN:
        required: false
      VITE_FIREBASE_DATABASE_URL:
        required: false
      VITE_FIREBASE_PROJECT_ID:
        required: false
      VITE_FIREBASE_STORAGE_BUCKET:
        required: false
      VITE_FIREBASE_MESSAGING_SENDER_ID:
        required: false
      VITE_FIREBASE_APP_ID:
        required: false
      GOOGLE_PLAY_SUBSCRIPTION_PRODUCT_IDS:
        required: false
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_DATABASE_URL: ${{ secrets.VITE_FIREBASE_DATABASE_URL }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      GOOGLE_PLAY_PACKAGE_NAME: com.drodriguez.my_rents
      GOOGLE_PLAY_SUBSCRIPTION_PRODUCT_IDS: ${{ secrets.GOOGLE_PLAY_SUBSCRIPTION_PRODUCT_IDS }}
      GOOGLE_PLAY_DEFAULT_COUNTRY_CODE: US
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Firebase build env
        shell: bash
        run: |
          missing=0
          required_vars=(
            VITE_FIREBASE_API_KEY
            VITE_FIREBASE_AUTH_DOMAIN
            VITE_FIREBASE_DATABASE_URL
            VITE_FIREBASE_PROJECT_ID
            VITE_FIREBASE_STORAGE_BUCKET
            VITE_FIREBASE_MESSAGING_SENDER_ID
            VITE_FIREBASE_APP_ID
          )

          for name in "${required_vars[@]}"; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing Firebase build env::$name is not set for the GitHub Pages deployment."
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Run quality checks
        run: |
          npm run format:check
          npm run lint
          npm run test:ci

      - name: Sync Google Play pricing catalog
        if: env.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON != ''
        run: npm run sync:play-pricing

      - name: Build for GitHub Pages
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
