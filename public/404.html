<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
        // Redirect all 404s to index.html for SPA routing
        var redirectTo = '/index.html';
        // Preserve path and query
        var path = location.pathname + location.search + location.hash;
        // Only redirect if not already at root
        if (path !== '/' && path !== '/index.html') {
            location.replace(redirectTo + '?redirect=' + encodeURIComponent(path));
        }
    </script>
</head>

<body>
    <h1>Redirecting...</h1>
</body>

</html>
