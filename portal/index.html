<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/portal/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Rents Portal</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      ;(() => {
        const url = new URL(window.location.href)
        const redirectPath = url.searchParams.get('p')

        if (!redirectPath) {
          return
        }

        url.searchParams.delete('p')
        const cleanedPath = decodeURIComponent(redirectPath)
        const nextUrl = `/portal${cleanedPath}`
        window.history.replaceState(null, '', nextUrl)
      })()
    </script>
    <script type="module" src="/portal/src/main.tsx"></script>
  </body>
</html>
