<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <link rel="icon" type="image/png" href="/src/assets/icon.png" />
    <link rel="alternate icon" type="image/vnd.microsoft.icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tenant Portal | Documents Center | MY RENTS</title>
    <meta
      name="description"
      content="Secure, passcode-protected Documents Center portal for tenants to review lease documents, payment receipts, and invoices."
    />
    <link rel="canonical" href="https://myrents-app.com/portal/" />

    <!-- Google Consent Mode v2 -->
    <script>
      window.dataLayer = window.dataLayer || []
      function gtag() {
        dataLayer.push(arguments)
      }
      gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: 'denied',
      })
    </script>

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://myrents-app.com/portal/" />
    <meta property="og:title" content="Tenant Portal | Documents Center | MY RENTS" />
    <meta
      property="og:description"
      content="Secure Documents Center portal for tenants to review lease documents and invoices."
    />
    <meta property="og:image" content="https://myrents-app.com/og-image.png" />
    <meta property="og:image:width" content="1024" />
    <meta property="og:image:height" content="500" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="MY RENTS Documents Center Tenant Portal" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://myrents-app.com/portal/" />
    <meta name="twitter:title" content="Tenant Portal | Documents Center | MY RENTS" />
    <meta
      name="twitter:description"
      content="Secure Documents Center portal for tenants to review lease documents and invoices."
    />
    <meta name="twitter:image" content="https://myrents-app.com/og-image.png" />
  </head>

  <body>
    <div id="root"></div>
    <script>
      ;(() => {
        const url = new URL(window.location.href)
        const redirectPath = url.searchParams.get('p')

        if (!redirectPath) {
          return
        }

        url.searchParams.delete('p')
        const cleanedPath = decodeURIComponent(redirectPath)
        const nextUrl = `/portal${cleanedPath}`
        window.history.replaceState(null, '', nextUrl)
      })()
    </script>
    <script type="module" src="/portal/src/main.tsx"></script>
  </body>
</html>
