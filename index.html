    <!-- JSON-LD Structured Data: FAQPage -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "What is My Rents?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "My Rents is an all-in-one mobile property management application designed for DIY landlords and independent property managers to track rent, expenses, leases, and tenant documents in one place."
            }
          },
          {
            "@type": "Question",
            "name": "Does My Rents work offline?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. My Rents features an offline-first architecture allowing you to record payments, take photos of repair receipts, and view lease details without an active internet connection."
            }
          },
          {
            "@type": "Question",
            "name": "How does the tenant portal work in My Rents?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "The Documents Center enables landlords to create a secure, passcode-protected link for any lease. Tenants can view active lease terms, invoices, and payment receipts from any web browser without downloading an app."
            }
          },
          {
            "@type": "Question",
            "name": "How does My Rents replace spreadsheets?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "My Rents replaces fragile spreadsheets with automated overdue alerts, on-site receipt photo capture, organized tax categorization, and single-tap financial export reports."
            }
          }
        ]
      }
    </script>
