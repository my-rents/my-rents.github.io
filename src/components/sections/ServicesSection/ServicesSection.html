<section id="services" class="services-section" :style="carouselStyle">
  <div class="section-shell services-section__shell">
    <div class="services-section__header" v-reveal>
      <SectionIntro :eyebrow="content.services.intro.eyebrow" :title="content.services.intro.title"
        :description="content.services.intro.description" />

      <CarouselControls :previous-label="content.controls.previousLabel" :next-label="content.controls.nextLabel"
        @previous="previous" @next="next" />
    </div>

    <div class="services-section__viewport" v-reveal="140">
      <div class="services-section__track">
        <article v-for="item in serviceItems" :key="item.title" class="services-section__card surface-card">
          <div class="services-section__media">
            <img :src="item.image" :alt="item.title" />
          </div>

          <div class="services-section__body">
            <p class="services-section__eyebrow">{{ item.eyebrow }}</p>
            <h3 class="services-section__title">{{ item.title }}</h3>
            <p class="services-section__description">{{ item.description }}</p>
          </div>
        </article>
      </div>
    </div>
  </div>
</section>
