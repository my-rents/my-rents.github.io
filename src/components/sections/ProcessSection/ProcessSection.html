<section id="how-to-start" class="process-section">
  <div class="section-shell process-section__shell">
    <div class="process-section__intro" v-reveal>
      <SectionIntro :eyebrow="content.process.intro.eyebrow" :title="content.process.intro.title"
        :description="content.process.intro.description" />
    </div>

    <div class="process-section__timeline">
      <article v-for="(step, index) in content.process.steps" :key="step.index" class="process-section__step"
        :class="{ 'process-section__step--reverse': index % 2 === 1 }" v-reveal="index * 90">
        <span class="process-section__index">{{ step.index }}</span>

        <div class="process-section__card surface-card">
          <h3>{{ step.title }}</h3>
          <p>{{ step.description }}</p>
        </div>
      </article>
    </div>
  </div>
</section>
