<section id="contact" class="contact-section">
  <div class="section-shell contact-section__shell">
    <div class="contact-section__intro" v-reveal>
      <SectionIntro eyebrow="Contact us" title="Get in touch with our experts team"
        description="Share the challenge you are solving, the support you need, and the timeline you are aiming for."
        tone="light" />
    </div>

    <form class="contact-section__form" @submit.prevent="handleSubmit" v-reveal="120">
      <label class="contact-section__field">
        <span>Name</span>
        <input v-model="form.name" type="text" name="name" autocomplete="name" placeholder="Your name" required />
      </label>

      <label class="contact-section__field">
        <span>Email</span>
        <input v-model="form.email" type="email" name="email" autocomplete="email" placeholder="you@example.com"
          required />
      </label>

      <label class="contact-section__field contact-section__field--wide">
        <span>Project details</span>
        <textarea v-model="form.message" name="message" rows="5" placeholder="Tell use what you are looking for."
          required></textarea>
      </label>

      <button class="contact-section__submit" type="submit">Submit</button>

      <p v-if="submitted" class="contact-section__status">
        Thanks. Your request has been captured and the team will follow up shortly.
      </p>
    </form>
  </div>
</section>
