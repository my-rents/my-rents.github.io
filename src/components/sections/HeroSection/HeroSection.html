<section class="hero-section">
  <div class="hero-section__shell section-shell">
    <div class="hero-section__panel">
      <div class="hero-section__content" v-reveal>
        <div class="hero-section__rating">
          <TrustBadge :label="content.hero.trustLabel" light />
        </div>

        <h1 class="hero-section__title">{{ content.hero.title }}</h1>

        <p class="hero-section__copy">{{ content.hero.copy }}</p>

        <div class="hero-section__actions">
          <AppButton
            :label="content.hero.contactCtaLabel"
            size="large"
            variant="ghost"
            :to="{ name: 'home', hash: '#contact' }"
          />

          <div class="hero-section__download">
            <a
              class="hero-section__store-link"
              :href="content.playStoreUrl"
              target="_blank"
              rel="noopener noreferrer"
              :aria-label="content.hero.playStoreCtaLabel"
            >
              <img
                :src="storeAndroid"
                :alt="content.hero.playStoreCtaLabel"
                width="256"
                height="84"
                decoding="async"
                loading="lazy"
              />
            </a>

            <a
              class="hero-section__store-link"
              :href="content.appStoreUrl"
              target="_blank"
              rel="noopener noreferrer"
              :aria-label="content.hero.appStoreCtaLabel"
            >
              <img
                :src="storeIos"
                :alt="content.hero.appStoreCtaLabel"
                width="256"
                height="84"
                decoding="async"
                loading="lazy"
              />
            </a>
          </div>
        </div>
      </div>

      <iframe
        class="hero-section__video"
        src="https://www.youtube.com/embed/NgkzksyO1PU"
        title="My Rents: Property Manager"
        loading="lazy"
        allow="
          accelerometer;
          autoplay;
          clipboard-write;
          encrypted-media;
          gyroscope;
          picture-in-picture;
          web-share;
        "
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen
      ></iframe>
    </div>

    <div class="hero-section__partners" v-reveal="220">
      <p class="hero-section__partners-label">{{ content.hero.partnersLabel }}:</p>
      <ul class="hero-section__partners-list">
        <li v-for="logo in content.hero.partners" :key="logo" class="hero-section__partner-pill">
          {{ logo }}
        </li>
      </ul>
    </div>
  </div>
</section>
