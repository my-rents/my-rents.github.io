<section id="who-its-for" class="team-section" :style="carouselStyle">
  <div class="section-shell team-section__shell">
    <div class="team-section__header" v-reveal>
      <SectionIntro
        :eyebrow="content.team.intro.eyebrow"
        :title="content.team.intro.title"
        :description="content.team.intro.description"
      />

      <CarouselControls
        :previous-label="content.controls.previousLabel"
        :next-label="content.controls.nextLabel"
        @previous="previous"
        @next="next"
      />
    </div>

    <div class="team-section__viewport" v-reveal="120">
      <div class="team-section__track">
        <article
          v-for="member in teamMembers"
          :key="member.name"
          class="team-section__card surface-card"
        >
          <div class="team-section__media">
            <img
              :src="member.image"
              :alt="member.name"
              :width="getTeamImageDimensions(member.image).width"
              :height="getTeamImageDimensions(member.image).height"
              decoding="async"
              loading="lazy"
              fetchpriority="low"
            />
          </div>

          <div class="team-section__body">
            <h3>{{ member.name }}</h3>
            <p>{{ member.role }}</p>
          </div>
        </article>
      </div>
    </div>
  </div>
</section>
