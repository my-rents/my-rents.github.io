<section class="faq-section">
  <div class="section-shell faq-section__shell">
    <div class="faq-section__intro" v-reveal>
      <SectionIntro
        eyebrow="FAQ"
        title="Answers to your most common questions"
        description="Straightforward answers about fit, process, timelines, and what happens after your first inquiry."
      />
    </div>

    <div class="faq-section__list" v-reveal="120">
      <AccordionItem
        v-for="(item, index) in faqItems"
        :key="item.question"
        :question="item.question"
        :answer="item.answer"
        :expanded="openIndex === index"
        @toggle="toggleItem(index)"
      />
    </div>
  </div>
</section>
