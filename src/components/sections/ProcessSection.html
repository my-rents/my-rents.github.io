<section id="how-it-works" class="process-section">
  <div class="section-shell process-section__shell">
    <div class="process-section__intro" v-reveal>
      <SectionIntro
        eyebrow="How it works"
        title="A proven process to achieve your biggest goals"
        description="Each stage removes uncertainty so the next one can move faster with less friction."
      />

      <AppButton label="Get in touch" :to="{ name: 'home', hash: '#contact' }" />
    </div>

    <div class="process-section__timeline">
      <article
        v-for="(step, index) in processSteps"
        :key="step.index"
        class="process-section__step"
        :class="{ 'process-section__step--reverse': index % 2 === 1 }"
        v-reveal="index * 90"
      >
        <span class="process-section__index">{{ step.index }}</span>

        <div class="process-section__card surface-card">
          <h3>{{ step.title }}</h3>
          <p>{{ step.description }}</p>
          <RouterLink class="process-section__link" :to="{ name: 'home', hash: '#contact' }">
            Discover More
          </RouterLink>
        </div>
      </article>
    </div>
  </div>
</section>
