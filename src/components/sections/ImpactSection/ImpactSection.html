<section id="features" class="impact-section">
  <div class="section-shell impact-section__shell">
    <SectionIntro
      :eyebrow="content.impact.intro.eyebrow"
      :title="content.impact.intro.title"
      :description="content.impact.intro.description"
      v-reveal
    />

    <div class="impact-section__grid">
      <div class="impact-section__visual surface-card" v-reveal="100">
        <Transition name="impact-feature" mode="out-in">
          <figure
            v-if="activeFeature"
            :key="activeFeature.title"
            class="impact-section__feature-frame"
          >
            <img :src="activeFeature.image" :alt="activeFeature.imageAlt" />
            <figcaption class="impact-section__visual-caption">
              {{ activeFeature.title }}
            </figcaption>
          </figure>
        </Transition>
      </div>

      <div class="impact-section__stats">
        <button
          v-for="(item, index) in featureItems"
          :key="item.title"
          class="impact-section__stat surface-card"
          :class="{ 'impact-section__stat--active': activeFeatureIndex === index }"
          type="button"
          :aria-pressed="activeFeatureIndex === index"
          @click="selectFeature(index)"
          v-reveal="index * 70"
        >
          <span class="impact-section__stat-copy">
            <strong>{{ item.title }}</strong>
            <span>{{ item.description }}</span>
          </span>
        </button>
      </div>
    </div>
  </div>
</section>
