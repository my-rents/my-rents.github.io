<header class="site-header">
  <div class="site-header__bar section-shell">
    <RouterLink class="site-header__brand" :to="{ name: 'home' }">My Rents</RouterLink>

    <nav class="site-header__nav" aria-label="Primary">
      <RouterLink v-for="item in primaryNav" :key="item.hash" class="site-header__link"
        :to="{ name: 'home', hash: item.hash }">
        {{ item.label }}
      </RouterLink>
    </nav>

    <AppButton class="site-header__cta" label="Get in touch" :to="{ name: 'home', hash: '#contact' }" />
  </div>
</header>
