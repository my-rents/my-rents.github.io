<main class="legal-view">
  <section class="legal-view__hero">
    <div class="section-shell legal-view__hero-shell">
      <div class="legal-view__copy">
        <h1>{{ page.title }}</h1>
        <p>{{ page.intro }}</p>
      </div>

      <AppButton :label="content.legalUi.backHomeLabel" variant="light" :to="{ name: 'home' }" />
    </div>
  </section>

  <section class="legal-view__body">
    <div class="section-shell section-shell--narrow">
      <article class="legal-view__card surface-card">
        <p class="legal-view__updated">
          {{ content.legalUi.lastUpdatedPrefix }} {{ page.updatedAt }}
        </p>

        <section v-for="section in page.sections" :key="section.title" class="legal-view__section">
          <h2>{{ section.title }}</h2>
          <p v-for="paragraph in section.paragraphs" :key="paragraph">{{ paragraph }}</p>
        </section>
      </article>
    </div>
  </section>
</main>
